; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:MIDAS]
platform = espressif32
board = esp32-s3-devkitc-1
; board = adafruit_feather_esp32s3
framework = arduino

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; upload_protocol = esp-builtin

lib_deps =
    sparkfun/SparkFun MMC5983MA Magnetometer Arduino Library@^1.1.4 ; Magnetometer
    adafruit/Adafruit BNO08x@^1.2.3
    stevemarple/MicroNMEA@^2.0.6
    sparkfun/SparkFun u-blox GNSS v3@^3.1.8
    beegee-tokyo/SX126x-Arduino@^2.0.27
    https://github.com/STMicroelectronics/lsm6dsv320x-pid
    ; solderedelectronics/Soldered CAN Bus Breakout Arduino Library@^1.0.0

